name: Final release qualification

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Release packages run containing the exact formal bytes
        required: true
      version:
        description: Current release version without the v prefix
        required: true
      prior_tag:
        description: Published prior release tag used for upgrade and rollback
        required: true
      prior_version:
        description: Prior release version without the v prefix
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: onyx-final-qualification-${{ inputs.build_run_id }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  BUILD_RUN_ID: ${{ inputs.build_run_id }}
  RELEASE_VERSION: ${{ inputs.version }}
  PRIOR_TAG: ${{ inputs.prior_tag }}
  PRIOR_VERSION: ${{ inputs.prior_version }}

jobs:
  attest-build:
    runs-on: ubuntu-latest
    outputs:
      build_sha: ${{ steps.attest.outputs.build_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: attest
        name: Attest exact completed build run
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "build_run_id must be decimal" >&2
            exit 1
          }
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "version is malformed" >&2
            exit 1
          }
          test "$PRIOR_TAG" = "v$PRIOR_VERSION" || {
            echo "prior_tag and prior_version do not match" >&2
            exit 1
          }
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID")"
          test "$(jq -r .conclusion <<<"$run_json")" = success
          test "$(jq -r .path <<<"$run_json")" = ".github/workflows/release-packages.yml"
          build_sha="$(jq -r .head_sha <<<"$run_json")"
          test "$build_sha" = "$GITHUB_SHA" || {
            echo "qualification checkout does not match the build run head SHA" >&2
            exit 1
          }
          mapfile -t artifacts < <(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/artifacts" \
              --jq '.artifacts[] | select(.expired == false) | .name' | sort
          )
          required=(
            onyx-formal-sbom
            onyx-macos-15
            onyx-ubuntu-24.04
            onyx-ubuntu-24.04-arm
            onyx-windows-latest
            onyx-windows-native-eligibility
          )
          for name in "${required[@]}"; do
            count="$(printf '%s\n' "${artifacts[@]}" | grep -Fxc "$name" || true)"
            test "$count" = 1 || {
              echo "build artifact is absent or ambiguous: $name" >&2
              exit 1
            }
          done
          if ! diff -u \
            <(printf '%s\n' "${required[@]}" | sort) \
            <(printf '%s\n' "${artifacts[@]}" | sort); then
            echo "build run contains an unexpected artifact set" >&2
            exit 1
          fi
          echo "build_sha=$build_sha" >> "$GITHUB_OUTPUT"

  windows-lifecycle:
    needs: attest-build
    runs-on: [self-hosted, onyx-ephemeral, Windows, X64]
    timeout-minutes: 90
    env:
      ONYX_DISPOSABLE_WINDOWS_CONFIRM: ONYX_DISPOSABLE_WINDOWS_LIFECYCLE_V1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: onyx-windows-latest
          path: current
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
      - name: Download prior published release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force prior | Out-Null
          gh release download $env:PRIOR_TAG --dir prior
      - id: inputs
        name: Resolve exact signed lifecycle artifacts
        shell: pwsh
        run: |
          python -m scripts.prepare_qualification_artifacts_v1 `
            --current-dir current `
            --prior-dir prior `
            --system Windows `
            --architecture x64 `
            --current-version $env:RELEASE_VERSION `
            --prior-version $env:PRIOR_VERSION `
            --github-output $env:GITHUB_OUTPUT
      - name: Require disposable interactive Windows desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Process explorer -ErrorAction SilentlyContinue)) {
            throw 'Native lifecycle requires an interactive disposable Windows desktop'
          }
      - name: Execute signed install, upgrade, rollback and uninstall lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m scripts.windows_lifecycle_validation `
            --current-setup '${{ steps.inputs.outputs.current_artifact }}' `
            --current-sha256 '${{ steps.inputs.outputs.current_sha256 }}' `
            --current-version $env:RELEASE_VERSION `
            --current-signer-thumbprint '${{ steps.inputs.outputs.current_signer_thumbprint }}' `
            --prior-setup '${{ steps.inputs.outputs.prior_artifact }}' `
            --prior-sha256 '${{ steps.inputs.outputs.prior_sha256 }}' `
            --prior-version $env:PRIOR_VERSION `
            --prior-signer-thumbprint '${{ steps.inputs.outputs.prior_signer_thumbprint }}' `
            --evidence-dir qualification
          Move-Item -LiteralPath qualification/windows-lifecycle-evidence.json `
            -Destination qualification/lifecycle-evidence-Windows-x64.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onyx-qualification-lifecycle-Windows-x64
          path: qualification/lifecycle-evidence-Windows-x64.json
          if-no-files-found: error
          retention-days: 90

  macos-lifecycle:
    needs: attest-build
    runs-on: [self-hosted, onyx-ephemeral, macOS, ARM64]
    timeout-minutes: 90
    env:
      ONYX_DISPOSABLE_MAC_CONFIRM: ONYX_DISPOSABLE_MAC_LIFECYCLE_V1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: onyx-macos-15
          path: current
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
      - name: Download prior published release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prior
          gh release download "$PRIOR_TAG" --dir prior
      - id: inputs
        name: Resolve exact notarized lifecycle artifacts
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.prepare_qualification_artifacts_v1 \
            --current-dir current \
            --prior-dir prior \
            --system Darwin \
            --architecture arm64 \
            --current-version "$RELEASE_VERSION" \
            --prior-version "$PRIOR_VERSION" \
            --github-output "$GITHUB_OUTPUT"
      - name: Require disposable interactive macOS desktop
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -f '%Su' /dev/console)" = "$USER"
          test "$(uname -m)" = arm64
      - name: Execute notarized install, upgrade, rollback and uninstall lifecycle
        shell: bash
        run: |
          set -euo pipefail
          quarantine="0083;$(printf '%x' "$(date +%s)");OnyxQualification;"
          xattr -w com.apple.quarantine "$quarantine" \
            '${{ steps.inputs.outputs.current_artifact }}'
          xattr -w com.apple.quarantine "$quarantine" \
            '${{ steps.inputs.outputs.prior_artifact }}'
          python -m scripts.macos_lifecycle_validation \
            --current-dmg '${{ steps.inputs.outputs.current_artifact }}' \
            --current-sha256 '${{ steps.inputs.outputs.current_sha256 }}' \
            --current-version "$RELEASE_VERSION" \
            --prior-dmg '${{ steps.inputs.outputs.prior_artifact }}' \
            --prior-sha256 '${{ steps.inputs.outputs.prior_sha256 }}' \
            --prior-version "$PRIOR_VERSION" \
            --evidence-dir qualification
          mv qualification/macos-lifecycle-evidence.json \
            qualification/lifecycle-evidence-Darwin-arm64.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onyx-qualification-lifecycle-Darwin-arm64
          path: qualification/lifecycle-evidence-Darwin-arm64.json
          if-no-files-found: error
          retention-days: 90

  linux-lifecycle:
    needs: attest-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner_arch: X64
            artifact: onyx-ubuntu-24.04
          - architecture: arm64
            runner_arch: ARM64
            artifact: onyx-ubuntu-24.04-arm
    runs-on: [self-hosted, onyx-ephemeral, Linux, "${{ matrix.runner_arch }}"]
    timeout-minutes: 90
    env:
      ONYX_DISPOSABLE_LINUX_CONFIRM: ONYX_DISPOSABLE_LINUX_LIFECYCLE_V1
      ONYX_LINUX_SIGNING_POLICY: unsigned-approved
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.artifact }}
          path: current
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
      - name: Download prior published release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prior
          gh release download "$PRIOR_TAG" --dir prior
      - id: inputs
        name: Resolve exact native lifecycle artifacts
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.prepare_qualification_artifacts_v1 \
            --current-dir current \
            --prior-dir prior \
            --system Linux \
            --architecture '${{ matrix.architecture }}' \
            --current-version "$RELEASE_VERSION" \
            --prior-version "$PRIOR_VERSION" \
            --github-output "$GITHUB_OUTPUT"
      - name: Require disposable interactive Linux desktop
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DISPLAY:-${WAYLAND_DISPLAY:-}}"
          test -n "${XDG_RUNTIME_DIR:-}"
          sudo -n true
          systemctl --user is-system-running | grep -Eq 'running|degraded'
      - name: Execute native install, upgrade, rollback and uninstall lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.linux_lifecycle_validation \
            --current-deb '${{ steps.inputs.outputs.current_artifact }}' \
            --current-sha256 '${{ steps.inputs.outputs.current_sha256 }}' \
            --current-version "$RELEASE_VERSION" \
            --prior-deb '${{ steps.inputs.outputs.prior_artifact }}' \
            --prior-sha256 '${{ steps.inputs.outputs.prior_sha256 }}' \
            --prior-version "$PRIOR_VERSION" \
            --evidence-dir qualification
          mv qualification/linux-lifecycle-evidence.json \
            'qualification/lifecycle-evidence-Linux-${{ matrix.architecture }}.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onyx-qualification-lifecycle-Linux-${{ matrix.architecture }}
          path: qualification/lifecycle-evidence-Linux-${{ matrix.architecture }}.json
          if-no-files-found: error
          retention-days: 90

  windows-long-session:
    needs: attest-build
    runs-on: [self-hosted, onyx-ephemeral, Windows, X64]
    timeout-minutes: 600
    env:
      ONYX_DISPOSABLE_WINDOWS_CONFIRM: ONYX_DISPOSABLE_WINDOWS_LIFECYCLE_V1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install monitor dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: onyx-windows-latest
          path: current
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
      - name: Download prior published release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force prior | Out-Null
          gh release download $env:PRIOR_TAG --dir prior
      - id: inputs
        name: Resolve exact signed soak artifacts
        shell: pwsh
        run: |
          python -m scripts.prepare_qualification_artifacts_v1 `
            --current-dir current `
            --prior-dir prior `
            --system Windows `
            --architecture x64 `
            --current-version $env:RELEASE_VERSION `
            --prior-version $env:PRIOR_VERSION `
            --github-output $env:GITHUB_OUTPUT
      - name: Install and start exact Onyx candidate
        id: launch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Process explorer -ErrorAction SilentlyContinue)) {
            throw 'Eight-hour qualification requires an interactive disposable Windows desktop'
          }
          $setup = '${{ steps.inputs.outputs.current_artifact }}'
          $install = Start-Process -FilePath $setup -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-'
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Setup failed: $($install.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Cyryx Labs\Onyx\Onyx.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw 'Installed Onyx executable is absent'
          }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          $live = Get-Process -Id $process.Id -ErrorAction SilentlyContinue
          if ($null -eq $live -or -not $live.Responding) {
            throw 'Installed Onyx did not remain alive and responsive'
          }
          "pid=$($live.Id)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "executable=$exe" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Execute uninterrupted eight-hour installed-host qualification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force qualification | Out-Null
          python -m scripts.monitor_windows_long_session `
            --pid '${{ steps.launch.outputs.pid }}' `
            --candidate "Onyx-$env:RELEASE_VERSION-formal" `
            --executable '${{ steps.launch.outputs.executable }}' `
            --receipt qualification/long-session-evidence-Windows-x64.json `
            --samples qualification/long-session-samples-Windows-x64.csv `
            --duration 28800 `
            --interval 60 `
            --poll-interval 5 `
            --rotation-receives 0 `
            --microphone-starts 0 `
            --playback-starts 0 `
            --rotation-application-errors 0 `
            --setup-sha256 '${{ steps.inputs.outputs.current_sha256 }}' `
            --portable-sha256 '${{ steps.inputs.outputs.current_portable_sha256 }}' `
            --bundle-root-sha256 '${{ steps.inputs.outputs.bundle_root_sha256 }}' `
            --source-transition-sha256 '${{ steps.inputs.outputs.source_transition_sha256 }}' `
            --sbom-sha256 '${{ steps.inputs.outputs.sbom_sha256 }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: onyx-qualification-long-session-Windows-x64
          path: |
            qualification/long-session-evidence-Windows-x64.json
            qualification/long-session-samples-Windows-x64.csv
          if-no-files-found: error
          retention-days: 90
      - name: Stop and uninstall soak candidate
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Get-Process Onyx -ErrorAction SilentlyContinue | Stop-Process -Force
          python -c "from pathlib import Path; from scripts.windows_lifecycle_validation import uninstall_app; Path('qualification-cleanup').mkdir(exist_ok=True); uninstall_app(Path('qualification-cleanup'), 'post-soak')"

  assemble:
    needs:
      - attest-build
      - windows-lifecycle
      - macos-lifecycle
      - linux-lifecycle
      - windows-long-session
    runs-on: ubuntu-latest
    environment:
      name: onyx-final-evidence-review
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    env:
      ONYX_INDEPENDENT_REVIEW_APPROVED: ${{ vars.ONYX_INDEPENDENT_REVIEW_APPROVED }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Attest exact native qualification artifact set
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t artifacts < <(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '.artifacts[] | select(.expired == false) | .name' | sort
          )
          required=(
            onyx-qualification-lifecycle-Darwin-arm64
            onyx-qualification-lifecycle-Linux-arm64
            onyx-qualification-lifecycle-Linux-x64
            onyx-qualification-lifecycle-Windows-x64
            onyx-qualification-long-session-Windows-x64
          )
          if ! diff -u \
            <(printf '%s\n' "${required[@]}" | sort) \
            <(printf '%s\n' "${artifacts[@]}" | sort); then
            echo "qualification run contains an unexpected artifact set" >&2
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: onyx-qualification-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: onyx-*
          path: release
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
      - name: Generate exact build-to-qualification provenance
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.generate_final_qualification_provenance_v1 \
            --release-dir release \
            --version "$RELEASE_VERSION" \
            --required-target Windows-x64 \
            --required-target Darwin-arm64 \
            --required-target Linux-x64 \
            --required-target Linux-arm64 \
            --build-run-id "$BUILD_RUN_ID" \
            --build-sha '${{ needs.attest-build.outputs.build_sha }}' \
            --qualification-run-id "$GITHUB_RUN_ID" \
            --qualification-sha "$GITHUB_SHA" \
            --output release/final-qualification-provenance.json
      - name: Independently review and seal final native evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.verify_final_release_qualification_v1 \
            --release-dir release \
            --version "$RELEASE_VERSION" \
            --required-target Windows-x64 \
            --required-target Darwin-arm64 \
            --required-target Linux-x64 \
            --required-target Linux-arm64 \
            --build-run-id "$BUILD_RUN_ID" \
            --build-sha '${{ needs.attest-build.outputs.build_sha }}' \
            --qualification-run-id "$GITHUB_RUN_ID" \
            --qualification-sha "$GITHUB_SHA" \
            --independent-review-approval "$ONYX_INDEPENDENT_REVIEW_APPROVED" \
            --independent-review-reference \
              "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --output release/final-release-qualification-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onyx-final-qualification-evidence
          path: |
            release/final-qualification-provenance.json
            release/final-release-qualification-receipt.json
            release/lifecycle-evidence-*.json
            release/long-session-evidence-Windows-x64.json
            release/long-session-samples-Windows-x64.csv
          if-no-files-found: error
          retention-days: 90
