name: CI

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --require-hashes -r requirements.lock
      - if: matrix.python-version == '3.13'
        run: python -m pip_audit -r requirements.lock
      - if: matrix.python-version == '3.13'
        run: python -m playwright install --with-deps chromium
      - if: matrix.python-version == '3.13'
        name: Offline installation readiness
        run: python -m core.readiness --json
      - run: ruff check . --select F,E9
      - run: ruff check . --select S102,S310,S314,S602
      - run: git -c core.whitespace=cr-at-eol diff --check
      - run: python -m compileall -q .
      - name: Prove V19 pytest collection is nonzero
        run: python scripts/verify_v19_pytest_collection.py
      - name: Runtime imports and tests under Xvfb
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a python -m pytest -v tests
      - name: Headless UI construction under Xvfb
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a python -c "from ui import OnyxUI; ui=OnyxUI('face.png'); ui._win.close(); print('ui-ok')"
      - if: matrix.python-version == '3.13'
        name: Dashboard AudioWorklet browser integration
        run: python -m pytest -v browser_tests

  windows-integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m playwright install chromium
      - name: Offline installation readiness
        run: python -m core.readiness --json
      - run: ruff check . --select F,E9
      - run: ruff check . --select S102,S310,S314,S602
      - run: git -c core.whitespace=cr-at-eol diff --check
      - run: python -m pip check
      - name: Prove V19 pytest collection is nonzero
        run: python scripts/verify_v19_pytest_collection.py
      - run: python -m pytest -v tests

  macos-integration:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m playwright install chromium
      - name: Offline installation readiness
        run: python -m core.readiness --json
      - run: ruff check . --select F,E9
      - run: ruff check . --select S102,S310,S314,S602
      - run: python -m pip check
      - name: Prove V19 pytest collection is nonzero
        run: python scripts/verify_v19_pytest_collection.py
      - run: python -m pytest -v tests
