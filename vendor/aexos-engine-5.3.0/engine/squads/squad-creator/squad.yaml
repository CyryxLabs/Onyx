config:
  extends: extend
dependencies:
  node: []
  squads: []
tested: true
updated_at: '2026-03-06'
entry_agent: squad-chief
settings:
  activation:
    show_ecosystem_report: true
    show_greeting: true
    show_quick_commands: true
  ecosystem_report:
    show_totals: true
    show_top_squads: true
    show_quality_refs: true
    show_gaps: false
    top_squads_limit: 5
workspace_integration:
  level: read_write
  rationale: >-
    O squad-creator consome contexto do workspace para scaffolding e validacao, e pode publicar
    artefatos em namespaces de templates/dominios durante setup.
  read_paths:
    - .aexos/project-context/
    - .aexos/project-context/_templates/
    - .aexos/project-context/domains/
  write_paths:
    - .aexos/project-context/_templates/
    - .aexos/project-context/domains/
  template_namespace: squad-governance
metadata:
  version: 4.0.0
  type: base
  pro_detection: true
  pro_path: squads/squad-creator-pro/config.yaml
  score: 9
  base_stats:
    agents: 1
    tasks: 24
    workflows: 3
    configs: 2
    checklists: 9
    data_files: 10
domain: Squad Creator
keywords:
  - squad-creator
  - squad
  - creator
agents:
  squad-chief:
    file: agents/squad-chief.md
    persona: Squad Architect
    title: Squad Creator & Domain Architect
    icon: ◈SC01
