name: squad-creator
version: 4.0.0
short-title: Squad Creator
description: >-
  Base meta-squad para criar squads de agentes via templates e validacao estrutural. Orchestrator:
  @squad-chief (triage, routing, criacao template-driven de squads). Base mode: 24 tasks, 3
  workflows, 1 agent. Pro mode: auto-detected via squad-creator-pro/ (adds mind cloning, DNA
  extraction, multi-agent orchestration, model routing, advanced optimization). v4.0: Base/Pro split
  — template-driven base, mind-cloning pro.
author: Cyryx Labs LLC
license: UNLICENSED
slashPrefix: squad-creator
tags: []
cyryx:
  minVersion: 2.1.0
  type: squad
