# ═══════════════════════════════════════════════════════════════════════════════
# AEXOS Squad Manifest — Deep Research Squad
# Conforms to .aexos-core/schemas/squad-schema.json (task-first architecture).
# components/ is derived from disk by scripts/normalize-squad-manifests.js.
# ═══════════════════════════════════════════════════════════════════════════════

name: deep-research
version: 1.0.0
short-title: Deep Research Squad
description: >-
  Squad de pesquisa profunda com pipeline 3-tier: Diagnostic (Tier 0), Execution (Tier 1), e Quality
  Assurance. 11 agents especializados baseados em elite minds reais — de Evidence-Based Medicine
  (Sackett) a Competitive Intelligence (Gilad), com QA obrigatório (Ioannidis + Kahneman).
author: Cyryx Labs LLC
license: UNLICENSED
slashPrefix: deep-research
tags:
  - deep-research
  - evidence-based
  - systematic-review
  - competitive-intelligence
  - osint
  - decision-science
  - bias-detection
  - pico
  - dora-metrics
  - sensemaking
cyryx:
  minVersion: 2.1.0
  type: squad
components:
  tasks:
    - analyze-competitive-intelligence.md
    - analyze-decision-patterns.md
    - assess-technical-performance.md
    - audit-decision-quality.md
    - audit-evidence-reliability.md
    - build-activation-plan.md
    - classify-research-query.md
    - conduct-systematic-review.md
    - delete-deep-research.md
    - design-research-plan.md
    - execute-web-search.md
    - formulate-pico-question.md
    - investigate-osint.md
    - select-review-methodology.md
    - synthesize-final-report.md
    - update-deep-research.md
    - validate-source-credibility.md
  agents:
    - booth.md
    - cochrane.md
    - creswell.md
    - dr-orchestrator.md
    - forsgren.md
    - gilad.md
    - higgins.md
    - ioannidis.md
    - kahneman.md
    - klein.md
    - sackett.md
  workflows:
    - wf-competitive-intel.yaml
    - wf-deep-research.yaml
    - wf-quick-research.yaml
  checklists:
    - decision-quality-checklist.md
    - evidence-reliability-checklist.md
    - pico-quality-checklist.md
    - pipeline-execution-checklist.md
    - report-completeness-checklist.md
    - source-credibility-checklist.md
  templates: []
  tools: []
  scripts:
    - deep-search.ts
    - search-providers.ts
config:
  extends: extend
dependencies:
  node: []
  squads: []
squad:
  name: deep-research
  display_name: Deep Research Squad
  version: 1.0.0
  domain: Evidence-Based Research Pipeline
  description: |
    Squad de pesquisa profunda com pipeline 3-tier: Diagnostic (Tier 0),
    Execution (Tier 1), e Quality Assurance. 11 agents especializados baseados
    em elite minds reais — de Evidence-Based Medicine (Sackett) a Competitive
    Intelligence (Gilad), com QA obrigatório (Ioannidis + Kahneman).
  philosophy: |
    "Every research question deserves a structured, evidence-based answer."
    O pipeline garante que toda query passa por diagnóstico (formular a pergunta
    certa), execução (reunir evidência), e QA (auditar vieses e qualidade).
  keywords:
    - deep-research
    - evidence-based
    - systematic-review
    - competitive-intelligence
    - osint
    - decision-science
    - bias-detection
    - pico
    - dora-metrics
    - sensemaking
  entry_agent: dr-orchestrator
  created_by: squad-creator-pro
  created_at: '2026-02-07'
  tested: false
workspace_integration:
  level: none
  rationale: >-
    O deep-research squad e self-contained. Nao consome nem produz artefatos no workspace/. Toda
    operacao acontece dentro do pipeline de pesquisa.
tiers:
  tier_0:
    name: Diagnostic
    agents:
      - sackett
      - booth
      - creswell
    purpose: >-
      Formulate the research question, select methodology, and design the research plan. Always runs
      first, sequentially.
  tier_1:
    name: Execution
    agents:
      - forsgren
      - cochrane
      - higgins
      - klein
      - gilad
    purpose: >-
      Deep specialist analysis. Runs in parallel — orchestrator selects relevant agents based on use
      case classification.
  qa:
    name: Quality Assurance
    agents:
      - ioannidis
      - kahneman
    purpose: >-
      Mandatory QA gate. Ioannidis audits evidence reliability (PPV, bias). Kahneman audits decision
      quality (cognitive biases). Always runs last, sequentially.
  orchestrator:
    name: Pipeline Coordinator
    agents:
      - dr-orchestrator
    purpose: Classify queries, route through pipeline, enforce quality gates, synthesize final report.
agents:
  booth:
    file: agents/booth.md
    tier: 0
    based_on: Andrew Booth (SALSA framework)
    icon: ◈DR01
    focus: Review methodology selection (14 types), SALSA/STARLITE frameworks
    persona: Andrew Booth
    title: Research Methodology Selector & Search Strategy Designer
  cochrane:
    file: agents/cochrane.md
    tier: 1
    based_on: Cochrane Collaboration (systematic reviews)
    icon: ◈DR02
    focus: Systematic literature reviews, evidence synthesis, PRISMA, GRADE evaluations
    persona: Archie Cochrane
    title: Father of Evidence-Based Medicine - Evidence Synthesis Auditor
  creswell:
    file: agents/creswell.md
    tier: 0
    based_on: John Creswell (mixed methods)
    icon: ◈DR03
    focus: Qualitative/quantitative/mixed methods design, data integration strategy
    persona: John W. Creswell
    title: Research Design Architect & Mixed Methods Specialist
  dr-orchestrator:
    file: agents/dr-orchestrator.md
    tier: orchestrator
    based_on: Original (Pipeline Coordinator)
    icon: ◈DR04
    focus: Query classification, pipeline routing, quality gates, report synthesis
    persona: DR Orchestrator
    title: Deep Research Pipeline Coordinator & Use Case Router
  forsgren:
    file: agents/forsgren.md
    tier: 1
    based_on: Nicole Forsgren (DORA/SPACE)
    icon: ◈DR05
    focus: Technical performance measurement, DORA metrics, DevOps assessment, SPACE framework
    persona: Nicole Forsgren
    title: Co-creator of DORA Metrics - Technical Performance Diagnostician
  gilad:
    file: agents/gilad.md
    tier: 1
    based_on: Ben Gilad (Competitive Intelligence)
    icon: ◈DR06
    focus: Competitive intelligence, strategic early warning, blind spot detection
    persona: Benjamin Gilad
    title: Co-founder of Competitive Intelligence - Competitive Intelligence Strategist
  higgins:
    file: agents/higgins.md
    tier: 1
    based_on: Eliot Higgins (Bellingcat/OSINT)
    icon: ◈DR07
    focus: Open-source investigations, source verification, geolocation, digital forensics
    persona: Eliot Higgins
    title: Founder of Bellingcat - OSINT Investigator & Source Verifier
  ioannidis:
    file: agents/ioannidis.md
    tier: qa
    based_on: John Ioannidis (Meta-research)
    icon: ◈DR08
    focus: Evidence reliability audit, PPV calculation, bias detection, research quality
    persona: John Ioannidis
    title: Founder of Meta-Research - Research Quality Auditor
  kahneman:
    file: agents/kahneman.md
    tier: qa
    based_on: Daniel Kahneman (Behavioral Economics)
    icon: ◈DR09
    focus: Cognitive bias audit, System 1/2, decision hygiene, pre-mortem analysis
    persona: Daniel Kahneman
    title: Nobel Prize Economics 2002 - Decision Quality Auditor & Bias Detector
  klein:
    file: agents/klein.md
    tier: 1
    based_on: Gary Klein (NDM/RPD)
    icon: ◈DR10
    focus: Pattern recognition, sensemaking, decision analysis, pre-mortem
    persona: Gary Klein
    title: Father of Naturalistic Decision Making - Expert Pattern Analyst & Sensemaking Specialist
  sackett:
    file: agents/sackett.md
    tier: 0
    based_on: David Sackett (EBM founder)
    icon: ◈DR11
    focus: PICO question formulation, evidence levels, EBM 5-step workflow
    persona: David Sackett
    title: Research Question Architect & EBM Framework Designer
handoffs:
  dr-orchestrator:
    routes_to:
      - sackett
      - booth
      - creswell
      - forsgren
      - cochrane
      - higgins
      - klein
      - gilad
      - ioannidis
      - kahneman
  sackett:
    hands_off_to:
      - booth
    escalates_to:
      - dr-orchestrator
  booth:
    receives_from:
      - sackett
    hands_off_to:
      - creswell
    escalates_to:
      - dr-orchestrator
  creswell:
    receives_from:
      - booth
    hands_off_to:
      - dr-orchestrator
    escalates_to:
      - dr-orchestrator
  forsgren:
    collaborates_with:
      - cochrane
    returns_to:
      - dr-orchestrator
  cochrane:
    collaborates_with:
      - forsgren
      - higgins
    returns_to:
      - dr-orchestrator
  higgins:
    collaborates_with:
      - cochrane
      - gilad
    returns_to:
      - dr-orchestrator
  klein:
    collaborates_with:
      - gilad
      - forsgren
    returns_to:
      - dr-orchestrator
  gilad:
    collaborates_with:
      - higgins
      - klein
    returns_to:
      - dr-orchestrator
  ioannidis:
    receives_from:
      - dr-orchestrator
    hands_off_to:
      - kahneman
  kahneman:
    receives_from:
      - ioannidis
    hands_off_to:
      - dr-orchestrator
pipeline:
  description: |
    Every research query follows this pipeline:
    1. dr-orchestrator classifies query into use cases (UC-001~004)
    2. Tier 0 runs sequentially: Sackett → Booth → Creswell
    3. Tier 1 runs in parallel: selected agents based on use case
    4. QA runs sequentially: Ioannidis → Kahneman
    5. dr-orchestrator synthesizes final report
  use_cases:
    UC-001:
      label: Technical Deep Dive
      primary_agents:
        - forsgren
        - cochrane
      secondary_agents:
        - klein
        - higgins
    UC-002:
      label: Strategic Decision Support
      primary_agents:
        - klein
        - gilad
      secondary_agents:
        - forsgren
        - cochrane
    UC-003:
      label: Competitive Intelligence
      primary_agents:
        - gilad
        - higgins
      secondary_agents:
        - klein
    UC-004:
      label: Evidence Synthesis
      primary_agents:
        - cochrane
        - forsgren
      secondary_agents:
        - higgins
quality_gates:
  QG-001:
    name: Question Quality
    agent: sackett
    placement: After Tier 0
    criteria: PICO question is well-formed with all 4 components
  QG-002:
    name: Methodology Fit
    agent: booth
    placement: After Tier 0
    criteria: Review type matches question type and available evidence
  QG-003:
    name: Evidence Reliability
    agent: ioannidis
    placement: After Tier 1
    criteria: PPV > threshold, bias patterns flagged, unreliable evidence identified
  QG-004:
    name: Decision Quality
    agent: kahneman
    placement: Final
    criteria: 12-Question Checklist passed, cognitive biases audited, pre-mortem completed
tools:
  exa:
    description: Web search for current information and sources
    used_by:
      - higgins
      - cochrane
      - gilad
      - dr-orchestrator
  context7:
    description: Library documentation lookup
    used_by:
      - forsgren
      - cochrane
  web_search:
    description: General web search for research queries
    used_by:
      - higgins
      - gilad
      - cochrane
cross_cutting:
  evidence_standards:
    description: All agents follow evidence hierarchy and cite sources
    applies_to: all
  structured_outputs:
    description: All agents produce structured outputs that feed downstream
    applies_to: all
  qa_mandatory:
    description: Every pipeline run MUST pass through both QA agents
    applies_to: all
settings:
  greeting:
    level: archetypal
    show_project_status: true
    show_pipeline_status: true
  activation:
    prefix: deep-research
    example: '@deep-research:dr-orchestrator'
quality_standards:
  min_score: 7
  smoke_tests: 3
  voice_dna_required: true
  thinking_dna_required: true
stats:
  total_agents: 11
  tier_0_diagnostic: 3
  tier_1_execution: 5
  qa_agents: 2
  orchestrator: 1
  total_tasks: 17
  total_workflows: 3
entry_agent: dr-orchestrator
