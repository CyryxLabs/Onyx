# ═══════════════════════════════════════════════════════════════════════════════
# AEXOS Squad Manifest — kaizen
# Conforms to .aexos-core/schemas/squad-schema.json (task-first architecture).
# components/ is derived from disk by scripts/normalize-squad-manifests.js.
# ═══════════════════════════════════════════════════════════════════════════════

name: kaizen
version: 1.3.0
short-title: kaizen
description: >-
  O squad que vigia e melhora todos os outros. Analisa continuamente o ecossistema de agentes,
  squads, ferramentas e competências. Detecta gaps, monitora performance, recomenda novos recursos.
  O sistema nervoso do seu projeto.
author: Cyryx Labs LLC
license: UNLICENSED
slashPrefix: kaizen
tags: []
cyryx:
  minVersion: 2.1.0
  type: squad
components:
  tasks:
    - audit-output-quality.md
    - auto-healing-gate.md
    - cost-analysis.md
    - detect-gaps.md
    - generate-recommendations.md
    - performance-dashboard.md
    - self-improve.md
    - update-radar.md
  agents:
    - bottleneck-hunter.md
    - capability-mapper.md
    - cost-analyst.md
    - kaizen-chief.md
    - performance-tracker.md
    - tech-radar.md
    - topology-analyst.md
  workflows:
    - wf-ecosystem-analysis.yaml
    - wf-self-improve.yaml
    - wf-weekly-report.yaml
  checklists:
    - agent-activation-checklist.md
    - analysis-quality-checklist.md
    - report-quality-checklist.md
  templates:
    - capability-map-tmpl.md
    - performance-dashboard-tmpl.md
    - tech-radar-tmpl.md
    - weekly-report-tmpl.md
  tools: []
  scripts:
    - kaizen-trigger.sh
    - validate-report.sh
config:
  extends: extend
dependencies:
  node: []
  squads: []
status: ACTIVE
cadence: semanal (domingo 20:00 BRT)
AEXOS:
  minVersion: 2.1.0
  type: squad
automation_boundary:
  deterministic:
    - Glob/Grep para inventário de squads, agentes, tasks
    - git log para métricas de atividade
    - Contagem e agregação de métricas (DORA, OKR)
    - Template rendering para relatórios
  probabilistic:
    - detect-gaps — análise de competência via Wardley Maps (LLM)
    - generate-recommendations — recomendações priorizadas (LLM)
    - cost-analysis — ROI e estimativas de custo (LLM)
    - self-improve — meta-análise e auto-melhoria (LLM)
    - audit-output-quality — avaliação qualitativa de outputs (LLM)
  autonomy_level: 2
  autonomy_rationale: Coleta de dados automática, análise requer LLM, decisões requerem humano.
commands:
  - name: '*analyze'
    description: Análise completa — 6 dimensões, todos os agentes
    skill: kaizen:analyze
  - name: '*gaps'
    description: Detecta competências e ferramentas que estão faltando
    skill: kaizen:gaps
  - name: '*performance'
    description: Dashboard de métricas (lead time, rework rate, throughput)
    skill: kaizen:performance
  - name: '*radar'
    description: Atualiza o radar de tecnologias (Adopt / Trial / Assess / Hold)
    skill: kaizen:radar
  - name: '*cost'
    description: Análise de custo por squad, por entrega, ROI
    skill: kaizen:cost
  - name: '*report'
    description: Relatório semanal com máx 5 recomendações priorizadas
  - name: '*self-improve'
    description: O squad analisa a si mesmo e aplica melhorias
    skill: kaizen:self-improve
metrics:
  agents: 7
  frameworks: 11
  heuristics: 35
  minds: 10
  quality_gates: 4
  weekly_cost: ~$4.50
entry_agent: kaizen-chief
domain: kaizen
keywords:
  - kaizen
agents:
  bottleneck-hunter:
    file: agents/bottleneck-hunter.md
    persona: Bottleneck Hunter
    title: System Constraint Analyst & Flow Optimizer
    icon: ◈KZ01
  capability-mapper:
    file: agents/capability-mapper.md
    persona: Capability Mapper
    title: Competency Gap Analyst & Resource Strategist
    icon: ◈KZ02
  cost-analyst:
    file: agents/cost-analyst.md
    persona: Cost Analyst
    title: FinOps Analyst & ROI Strategist
    icon: ◈KZ03
  kaizen-chief:
    file: agents/kaizen-chief.md
    persona: Kaizen Chief
    title: Ecosystem Intelligence Orchestrator
    icon: ◈KZ04
  performance-tracker:
    file: agents/performance-tracker.md
    persona: Performance Tracker
    title: Squad Performance Analyst & Metrics Diagnostician
    icon: ◈KZ05
  tech-radar:
    file: agents/tech-radar.md
    persona: Tech Radar
    title: Technology Evaluator & Fitness Function Architect
    icon: ◈KZ06
  topology-analyst:
    file: agents/topology-analyst.md
    persona: Topology Analyst
    title: Squad Structure Analyst & Cognitive Load Diagnostician
    icon: ◈KZ07
