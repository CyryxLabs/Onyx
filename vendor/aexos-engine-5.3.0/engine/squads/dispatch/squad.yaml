context_economy:
  pricing_2026:
    haiku:
      input_per_mtok: 1
      output_per_mtok: 5
      cache_write_per_mtok: 1.25
      cache_read_per_mtok: 0.1
    sonnet:
      input_per_mtok: 3
      output_per_mtok: 15
      cache_write_per_mtok: 3.75
      cache_read_per_mtok: 0.3
    opus:
      input_per_mtok: 5
      output_per_mtok: 25
      cache_write_per_mtok: 6.25
      cache_read_per_mtok: 0.5
  cost_ratio:
    main_context_vs_haiku: 43x more expensive
    main_context_vs_haiku_cached: 58x more expensive
  subagent_constraints:
    max_concurrent: 10
    recommended_wave_size: 5-7
    nesting: FORBIDDEN
    background_mcp: UNAVAILABLE
    max_result_tokens: 500
