title: Apex Squad — Frontend Ultra-Premium
patternPrefix: AX
platforms:
  - web
  - mobile
  - spatial
model: hybrid-premium
tiers:
  orchestrator: apex-lead
  tier_1:
    - frontend-arch
  tier_2:
    - interaction-dsgn
    - design-sys-eng
    - web-intel
  tier_3:
    - css-eng
    - react-eng
    - mobile-eng
    - cross-plat-eng
    - spatial-eng
  tier_4:
    - motion-eng
    - a11y-eng
    - perf-eng
  tier_5:
    - qa-visual
    - qa-xplatform
quality_standards:
  performance:
    web:
      lcp: < 1.2s
      inp: < 200ms
      cls: < 0.1
      first_load_js: < 80KB gzipped
    mobile:
      startup: < 1s
      fps: '>= 60'
      anr: 0%
  accessibility:
    wcag_level: AA
    axe_score: 100
  visual:
    regression_threshold: 0 pixels
    grid: 4px
  motion:
    target_fps: 60
    reduced_motion: mandatory
